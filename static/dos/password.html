<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Password Required</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #111;
    }

    #passwordScreen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #111;

      z-index: 999999;
    }

    #passwordBox {
      width: 340px;
      padding: 30px;

      background: #222;
      border-radius: 14px;

      text-align: center;

      box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
    }

    #passwordBox h1 {
      color: white;
      margin: 0 0 20px 0;
      font-size: 26px;
    }

    #passwordInput {
      width: 100%;
      padding: 12px;

      border: none;
      outline: none;

      border-radius: 7px;

      font-size: 16px;

      margin-bottom: 12px;
    }

    #confirmButton {
      width: 100%;
      padding: 12px;

      border: none;
      border-radius: 7px;

      background: #444;
      color: white;

      font-size: 16px;
      cursor: pointer;
    }

    #confirmButton:hover {
      background: #555;
    }

    #error {
      color: #ff4d4d;
      margin: 12px 0 0 0;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div id="passwordScreen">

    <div id="passwordBox">

      <h1>Enter Password</h1>

      <input
        id="passwordInput"
        type="text"
        placeholder="Enter password..."
        autocomplete="off"
      >

      <button id="confirmButton">
        Confirm
      </button>

      <p id="error"></p>

    </div>

  </div>

  <script src="/password.js"></script>

</body>
</html>
