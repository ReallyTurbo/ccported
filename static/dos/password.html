<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Password Required | SchoolPorted</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.06), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(80, 120, 255, 0.08), transparent 30%),
        #101114;

      color: white;
      overflow: hidden;
    }

    #passwordScreen {
      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    #passwordBox {
      width: 100%;
      max-width: 410px;

      padding: 34px;

      background: rgba(30, 32, 38, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.12);

      border-radius: 22px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      text-align: center;
    }

    #logo {
      width: 58px;
      height: 58px;

      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 16px;

      background: rgba(255, 255, 255, 0.08);

      font-size: 26px;
      font-weight: 700;

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    #passwordBox h1 {
      margin: 0;

      font-size: 26px;
      font-weight: 700;

      letter-spacing: -0.5px;
    }

    #subtitle {
      margin: 10px 0 24px;

      color: rgba(255, 255, 255, 0.62);

      font-size: 14px;
      line-height: 1.5;
    }

    #passwordInput {
      width: 100%;

      padding: 14px 15px;

      border: 1px solid rgba(255, 255, 255, 0.10);
      outline: none;

      border-radius: 12px;

      background: rgba(255, 255, 255, 0.07);
      color: white;

      font-size: 16px;

      transition: 0.2s ease;
    }

    #passwordInput::placeholder {
      color: rgba(255, 255, 255, 0.38);
    }

    #passwordInput:focus {
      border-color: rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.09);
    }

    #confirmButton {
      width: 100%;

      margin-top: 12px;

      padding: 14px;

      border: none;
      border-radius: 12px;

      background: #ffffff;
      color: #111;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    #confirmButton:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }

    #confirmButton:active {
      transform: translateY(0);
    }

    #error {
      min-height: 20px;

      margin: 13px 0 0;

      color: #ff6b6b;

      font-size: 13px;
    }

    #footerText {
      margin-top: 20px;

      color: rgba(255, 255, 255, 0.32);

      font-size: 11px;
    }

    @media (max-width: 480px) {
      #passwordBox {
        padding: 26px 22px;
      }

      #passwordBox h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <div id="passwordScreen">

    <div id="passwordBox">

      <div id="logo">S</div>

      <h1>Password Required</h1>

      <p id="subtitle">
        Enter the password shown in the browser console to continue.
      </p>

      <input
        type="text"
        id="passwordInput"
        placeholder="Enter password"
        autocomplete="off"
        spellcheck="false"
      >

      <button id="confirmButton">
        Continue
      </button>

      <p id="error"></p>

      <div id="footerText">
        SchoolPorted
      </div>

    </div>

  </div>

  <script src="./password.js"></script>

</body>
</html>
