<!-- Discord notification -->
<script>
  (async () => {
    console.log("=================================");
    console.log("🔵 Discord notification: starting");
    console.log("=================================");

    try {
      console.log("📡 Sending POST request to /api/visit...");

      const response = await fetch("/api/visit", {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          page: window.location.pathname,
          userAgent: navigator.userAgent,
          screen:
            window.screen.width +
            "x" +
            window.screen.height,
          referrer:
            document.referrer || "Direct visit"
        })
      });

      const responseText = await response.text();

      console.log("---------------------------------");
      console.log("📥 API RESPONSE");
      console.log("Status:", response.status);
      console.log("Response:", responseText);
      console.log("---------------------------------");

      if (!response.ok) {
        console.error(
          "❌ DISCORD NOTIFICATION FAILED"
        );

        console.error(
          "HTTP Status:",
          response.status
        );

        console.error(
          "Server response:",
          responseText
        );

        return;
      }

      console.log(
        "✅ DISCORD NOTIFICATION SENT SUCCESSFULLY"
      );

    } catch (error) {
      console.error(
        "❌ COULD NOT CONTACT /api/visit"
      );

      console.error(
        "Error:",
        error
      );

      console.error(
        "Error message:",
        error.message
      );
    }

    console.log("=================================");
  })();
</script>
