<!-- Discord notification test -->
<script>
  async function testDiscordNotification() {
    const status = document.getElementById("discord-status");

    try {
      status.textContent =
        "Discord notification: sending...";

      const response = await fetch("/api/visit", {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          page: window.location.pathname,
          userAgent: navigator.userAgent,
          screen:
            window.screen.width +
            "x" +
            window.screen.height,
          referrer:
            document.referrer || "Direct visit"
        })
      });

      const responseText = await response.text();

      if (!response.ok) {
        status.textContent =
          "❌ DISCORD NOTIFICATION FAILED\n\n" +
          "HTTP Status: " +
          response.status +
          "\n\n" +
          "Server response:\n" +
          responseText;

        console.error(
          "Discord API error:",
          response.status,
          responseText
        );

        return;
      }

      status.textContent =
        "✅ DISCORD NOTIFICATION SENT\n\n" +
        responseText;

      console.log(
        "Discord notification succeeded:",
        responseText
      );

    } catch (error) {
      status.textContent =
        "❌ COULD NOT CONTACT /api/visit\n\n" +
        "Error: " +
        error.message +
        "\n\n" +
        "Possible causes:\n" +
        "- /api/visit.js does not exist\n" +
        "- The API was not deployed\n" +
        "- Vercel routing is incorrect\n" +
        "- The request was blocked\n\n" +
        "Check the browser console for more details.";

      console.error(
        "Discord notification request failed:",
        error
      );
    }
  }

  testDiscordNotification();
</script>
