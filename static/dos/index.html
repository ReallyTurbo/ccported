<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Password Required</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #111;
    }

    #passwordScreen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #111;
      z-index: 999999;
    }

    #passwordBox {
      width: 340px;
      padding: 30px;

      background: #222;
      border-radius: 14px;

      text-align: center;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
    }

    #passwordBox h1 {
      color: white;
      margin: 0 0 20px;
    }

    #passwordInput {
      width: 100%;
      padding: 12px;

      border: none;
      outline: none;
      border-radius: 7px;

      font-size: 16px;
      margin-bottom: 12px;
    }

    #confirmButton {
      width: 100%;
      padding: 12px;

      border: none;
      border-radius: 7px;

      background: #444;
      color: white;

      font-size: 16px;
      cursor: pointer;
    }

    #confirmButton:hover {
      background: #555;
    }

    #error {
      color: #ff4d4d;
      min-height: 20px;
      margin-top: 12px;
    }
  </style>
</head>

<body>

  <div id="passwordScreen">

    <div id="passwordBox">

      <h1>Enter Password</h1>

      <input
        type="text"
        id="passwordInput"
        placeholder="Password"
        autocomplete="off"
      >

      <button id="confirmButton">
        Confirm
      </button>

      <p id="error"></p>

    </div>

  </div>

  <script>
    // Generate random 3-digit number
    const randomNumber = Math.floor(Math.random() * 900) + 100;

    // Create password
    const password = "SchoolSucks" + randomNumber;

    // Show password in browser console
    console.log("Password = " + password);

    const input = document.getElementById("passwordInput");
    const button = document.getElementById("confirmButton");
    const error = document.getElementById("error");

    function checkPassword() {
      const entered = input.value;

      if (entered === password) {

        localStorage.setItem("passwordPassed", "true");

        window.location.href = "/";

      } else {

        error.textContent = "Incorrect password.";
        input.value = "";
        input.focus();

      }
    }

    button.addEventListener("click", checkPassword);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        checkPassword();
      }
    });
  </script>

</body>
</html>
