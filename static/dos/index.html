<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">

  <title>DOS Loader | Unblocked on CCPorted</title>

  <meta name="robots" content="noindex, nofollow">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    /* LOADING SCREEN */

    #loadingScreen {
      position: fixed;
      inset: 0;
      z-index: 999999;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f7f8fa;

      opacity: 1;

      transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
    }

    #loadingScreen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loadingContent {
      display: flex;
      flex-direction: column;
      align-items: center;

      font-family: Arial, Helvetica, sans-serif;

      animation: appear 0.8s ease forwards;
    }

    .logo {
      width: 72px;
      height: 72px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 20px;

      background: white;
      color: #17181c;

      font-size: 32px;
      font-weight: 700;

      border: 1px solid #e5e7eb;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.08),
        0 4px 12px rgba(0, 0, 0, 0.04);

      animation: float 2s ease-in-out infinite;
    }

    .title {
      margin-top: 20px;

      color: #17181c;

      font-size: 22px;
      font-weight: 700;

      letter-spacing: -0.4px;
    }

    .subtitle {
      margin-top: 7px;

      color: #8a8e96;

      font-size: 13px;
    }

    .loader {
      width: 150px;
      height: 3px;

      margin-top: 25px;

      overflow: hidden;

      border-radius: 999px;

      background: #e6e7ea;
    }

    .loaderBar {
      width: 45%;
      height: 100%;

      border-radius: 999px;

      background: #17181c;

      animation: loading 1.2s ease-in-out infinite;
    }

    .footer {
      position: absolute;
      bottom: 28px;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 11px;

      color: #b0b3b9;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    @keyframes loading {
      0% {
        transform: translateX(-140%);
      }

      50% {
        transform: translateX(100%);
      }

      100% {
        transform: translateX(320%);
      }
    }
  </style>

  <!-- Show loading screen immediately -->
  <script>
    document.documentElement.style.background = "#f7f8fa";
  </script>

</head>

<body>

  <script src="/emulator/dos/script.js"></script>


  <!-- PASSWORD CHECK + LOADING FINISH -->

  <script>
    const loadingScreen =
      document.getElementById("loadingScreen");

    const passwordPassed =
      localStorage.getItem("passwordPassed") === "true";


    /*
     * Keep the loading screen visible long enough
     * for the animation to actually be seen.
     */
    setTimeout(() => {

      loadingScreen.classList.add("hidden");


      /*
       * Wait for the fade-out to finish,
       * then redirect if necessary.
       */
      setTimeout(() => {

        if (!passwordPassed) {
          window.location.replace("/dos/password.html");
        }

      }, 800);

    }, 1800);
  </script>
