<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">

  <title>DOS Loader | Unblocked on CCPorted</title>

  <meta name="robots" content="noindex, nofollow">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: #f7f8fa;
    }

    /* LOADING SCREEN */

    #loadingScreen {
      position: fixed;
      inset: 0;
      z-index: 999999;

      width: 100vw;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f7f8fa;

      opacity: 1;
      visibility: visible;

      transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
    }

    #loadingScreen.fadeOut {
      opacity: 0;
      visibility: hidden;
    }

    .loadingContent {
      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;

      font-family: Arial, Helvetica, sans-serif;

      animation: contentIn 1s ease forwards;
    }

    .logo {
      width: 76px;
      height: 76px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ffffff;

      border: 1px solid #e5e7eb;
      border-radius: 22px;

      color: #17181c;

      font-size: 34px;
      font-weight: 700;

      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.08),
        0 3px 12px rgba(0, 0, 0, 0.04);

      animation: logoFloat 2s ease-in-out infinite;
    }

    .title {
      margin-top: 22px;

      color: #17181c;

      font-size: 23px;
      font-weight: 700;

      letter-spacing: -0.5px;
    }

    .subtitle {
      margin-top: 8px;

      color: #8b8f97;

      font-size: 13px;
    }

    .loader {
      width: 170px;
      height: 4px;

      margin-top: 28px;

      overflow: hidden;

      background: #e4e6e9;

      border-radius: 999px;
    }

    .loaderBar {
      width: 50%;
      height: 100%;

      background: #17181c;

      border-radius: 999px;

      animation: loaderMove 1.1s ease-in-out infinite;
    }

    .footer {
      position: absolute;
      bottom: 28px;

      font-family: Arial, Helvetica, sans-serif;

      color: #b0b3b9;

      font-size: 11px;

      letter-spacing: 0.2px;
    }

    @keyframes contentIn {
      from {
        opacity: 0;
        transform: translateY(15px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes logoFloat {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes loaderMove {
      0% {
        transform: translateX(-130%);
      }

      50% {
        transform: translateX(100%);
      }

      100% {
        transform: translateX(300%);
      }
    }
  </style>
</head>

<body>

  <!-- LOADING SCREEN -->
  <div id="loadingScreen">

    <div class="loadingContent">

      <div class="logo">S</div>

      <div class="title">
        SchoolPorted
      </div>

      <div class="subtitle">
        Loading your experience
      </div>

      <div class="loader">
        <div class="loaderBar"></div>
      </div>

    </div>

    <div class="footer">
      SchoolPorted
    </div>

  </div>


  <!-- MAIN PAGE -->

  <link rel="stylesheet" href="/emulator/dos/styles.css">
  <link rel="stylesheet" href="/emulator/dos/js-dos.css">

  <script src="/emulator/dos/js-dos.js"></script>


  <div id="container">
    <div id="subContainer">

      <div id="gameContainer" width="640" height="400"></div>

      <div id="fullScreenBar">

        <h3 id="gameFName">
          DOS Loader
        </h3>

        <div class="actions">

          <div id="save">
            <img
              src="/assets/images/save.png"
              alt="Save">
          </div>

          <div id="fullscreen">
            <img
              src="/assets/images/fullscreen.png"
              alt="Fullscreen">
          </div>

        </div>

      </div>

    </div>
  </div>


  <script src="/emulator/dos/script.js"></script>


  <!-- 3 SECOND LOADING SCREEN -->

  <script>
    const loadingScreen =
      document.getElementById("loadingScreen");

    const passwordPassed =
      localStorage.getItem("passwordPassed") === "true";

    /*
     * EXACTLY 3 SECONDS before
     * the loading screen begins fading.
     */
    setTimeout(function () {

      loadingScreen.classList.add("fadeOut");

      /*
       * Wait until the fade-out finishes.
       */
      setTimeout(function () {

        if (!passwordPassed) {
          window.location.replace("/dos/password.html");
        }

      }, 800);

    }, 3000);
  </script>

</body>
