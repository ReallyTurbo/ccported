<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter Password</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      width: min(420px, 90%);
      padding: 35px;
      background: #151515;
      border: 1px solid #292929;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      color: #aaa;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #0d0d0d;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #fff;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: .85;
    }

    #message {
      min-height: 20px;
      margin-top: 14px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Enter Password</h1>
    <p>Enter the password you were given to continue.</p>

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="off"
    >

    <button id="submit">Continue</button>

    <div id="message"></div>
  </div>

  <script src="/password.js"></script>

</body>
</html>
