<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Launch SchoolPorted</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,system-ui,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f7fb;
}

.card{
    width:420px;
    max-width:90%;
    background:white;
    border-radius:24px;
    padding:32px;
    box-shadow:0 20px 60px rgba(0,0,0,.08);
    text-align:center;
}

.logo{
    width:72px;
    height:72px;
    border-radius:18px;
    margin:auto;
    background:#4285f4;
    color:white;
    font-size:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
}

h1{
    margin-top:18px;
    color:#111827;
}

p{
    margin-top:12px;
    color:#6b7280;
    line-height:1.6;
}

.button{
    margin-top:24px;
    width:100%;
    border:none;
    border-radius:14px;
    padding:14px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
}

.button:hover{
    transform:translateY(-1px);
}

.small{
    margin-top:16px;
    font-size:13px;
}
</style>

</head>
<body>

<div class="card">
    <div class="logo">S</div>

```
<h1>Launch SchoolPorted</h1>

<p>
    SchoolPorted uses a separate tab for the best experience.
    Please allow popups and click continue.
</p>

<button class="button" onclick="launch()">
    Continue
</button>

<p class="small">
    Your browser may ask for popup permission.
</p>
```

</div>

<script>
function launch() {

    const win = window.open("about:blank","_blank");

    if(!win){
        alert("Please allow popups for this site.");
        return;
    }

    sessionStorage.setItem("cloaked","true");

    win.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>Google</title>
            <link rel="icon"
            href="https://www.google.com/favicon.ico">
            <style>
                html,body,iframe{
                    margin:0;
                    width:100%;
                    height:100%;
                    border:none;
                    overflow:hidden;
                }
            </style>

```
    </head>
    <body>
        <iframe src="${location.origin}"></iframe>
    </body>
    </html>
`);

win.document.close();

location.replace("https://google.com");
```

} </script>

</body>
</html>
